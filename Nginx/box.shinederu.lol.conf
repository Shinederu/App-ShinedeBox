server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name box.shinederu.ch;

    root /var/www/ShinedeBox;
    index index.html;

    ssl_certificate /etc/nginx/ssl/*.shinederu.ch_shinederu.ch_P256/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/*.shinederu.ch_shinederu.ch_P256/private.key;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend deplace vers api.shinederu.ch/box
    location ^~ /api/ {
        return 404;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100G;
}

server {
    listen 80;
    listen [::]:80;
    server_name box.shinederu.ch;
    return 301 https://$host$request_uri;
}

